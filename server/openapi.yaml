  # ── Reservations ──────────────────────────────────────────────────────────
  /reservations:
    get:
      tags: [Reservations]
      summary: List reservations 🔓
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [date_start, date_end, status, date_created, date_updated]
            default: date_start
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: user_id
          in: query
          description: Filter by student/pilot
          schema:
            type: integer
        - name: aircraft_id
          in: query
          schema:
            type: integer
        - name: instructor_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - name: start_from
          in: query
          description: |
            Filter reservations whose `date_start` is on or after this value.
            Use this (together with `start_to`) for list-view date range filters.
            Independent of the overlap-based `date_from`/`date_to` params.
          schema:
            type: string
            format: date-time
        - name: start_to
          in: query
          description: Filter reservations whose `date_start` is on or before this value.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated reservations with embedded user, aircraft, and instructor info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Reservation'

    post:
      tags: [Reservations]
      summary: Create reservation 🔓
      description: |
        **Business rules:**
        - `user_id` must belong to a user with `STUDENT`, `PILOT`, or `INSTRUCTOR` role.
        - At least one of `aircraft_id` or `instructor_id` must be provided.
        - Reserving an aircraft without an instructor requires the `PILOT` role.
        - Returns 409 if the aircraft or instructor has a conflicting booking.
        - Auto-creates an `InstructorSchedule` entry (type `INSTRUCTION`) and/or an
          `AircraftSchedule` entry (type `RESERVED`) when status is `RESERVED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationBody'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: User does not have PILOT role for solo aircraft reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: User or instructor role validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Reservations]
      summary: Get reservation by ID 🔓
      responses:
        '200':
          description: Reservation record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Reservations]
      summary: Update reservation 🔓
      description: |
        All fields are optional — only provided fields are updated.
        Setting `status` to `CANCELED` automatically deletes the linked
        `InstructorSchedule` and `AircraftSchedule` entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationBody'
      responses:
        '200':
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Role validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Reservations]
      summary: Delete reservation 🔓
      description: |
        Permanently deletes the reservation. Linked `InstructorSchedule` and
        `AircraftSchedule` entries are removed automatically via cascade.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
