  # ── Instructor Schedule ───────────────────────────────────────────────────
  /instructor-schedule:
    get:
      tags: [Instructor Schedule]
      summary: List instructor schedule entries 🔓
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [date_start, date_end, activity_type, date_created]
            default: date_start
        - name: sortOrder
          in: query
          schema:
